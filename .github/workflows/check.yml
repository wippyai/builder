name: Builder
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: make check
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.27.0'
        cache: false
    - name: Build pinned development runtime
      run: |
        python3 builder.py toolchain examples/hello/wippy.build.json --output dist/wippy
    - name: Prepare fixture pack
      run: |
        make example-pack WIPPY="$PWD/dist/wippy"
        python3 builder.py seal examples/hello/wippy.build.json
    - uses: ./
      with:
        manifest: examples/hello/wippy.build.json
        output: dist/hello
    - name: Verify standalone execution with networking disabled
      run: sudo unshare --net -- python3 tests/standalone.py "$PWD/dist/hello"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: hello-linux-amd64
        path: |
          dist/hello
          dist/hello.provenance.json
