name: Builder
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: go.mod
        cache: false
    - run: make check
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Build pinned development runtime
      uses: ./
      with:
        mode: toolchain
        manifest: examples/hello/wippy.build.json
        output: dist/wippy
    - name: Prepare fixture pack
      run: make example-pack WIPPY="$PWD/dist/wippy"
    - uses: ./
      with:
        manifest: examples/hello/wippy.build.json
        output: dist/hello
    - name: Verify standalone execution with networking disabled
      run: |
        GOWORK=off go test -c -o dist/acceptance ./internal/assemble
        sudo unshare --net -- env WIPPY_TEST_BINARY="$PWD/dist/hello" ./dist/acceptance -test.run '^TestStandalone$' -test.v
    - name: Verify canonical Hub updates through the binary
      run: GOWORK=off WIPPY_TEST_BINARY="$PWD/dist/hello" WIPPY_TEST_MANIFEST="$PWD/examples/hello/wippy.build.json" go test ./internal/assemble -run '^TestHub$' -count=1 -v
    - name: Verify bootstrap mode
      run: |
        cp examples/hello/wippy.build.json examples/hello/bootstrap.json
        dist/wippy-builder seal examples/hello/bootstrap.json --mode bootstrap
        dist/wippy-builder build examples/hello/bootstrap.json --output dist/hello-bootstrap
        WIPPY_TEST_BINARY="$PWD/dist/hello-bootstrap" WIPPY_TEST_BOOTSTRAP=1 ./dist/acceptance -test.run '^TestStandalone$' -test.v
    - name: Archive release inputs
      run: dist/wippy-builder package dist/hello --output dist/hello-linux-amd64.tar.gz
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: hello-linux-amd64
        path: |
          dist/hello-linux-amd64.tar.gz
          dist/hello-linux-amd64.tar.gz.sha256
