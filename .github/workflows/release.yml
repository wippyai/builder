name: Builder release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builder-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require a release tag from main
      shell: bash
      run: |
        test "$GITHUB_REF_TYPE" = tag
        number='(0|[1-9][0-9]*)'
        identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        pattern="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
        [[ "$GITHUB_REF_NAME" =~ $pattern ]]
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: validate
    uses: ./.github/workflows/check.yml
  release:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: v2.18.1
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ github.token }}
