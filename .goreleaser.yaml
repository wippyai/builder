version: 2
project_name: wippy-builder
builds:
  - id: cli
    main: ./cmd/wippy-builder
    binary: wippy-builder
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
checksum:
  name_template: SHA256SUMS
snapshot:
  version_template: '{{ .Env.RELEASE_VERSION }}'
release:
  draft: true
changelog:
  use: git
