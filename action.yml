name: Build Wippy application
description: Assemble a native executable from a pinned application manifest
inputs:
  manifest:
    description: Application build manifest relative to the workspace
    required: true
  output:
    description: Executable output path relative to the workspace
    required: true
  mode:
    description: Build an application executable or its native development toolchain
    default: build
  token:
    description: GitHub token for private native module fetching
    default: ${{ github.token }}
outputs:
  builder:
    description: Builder executable for subsequent Makefile packaging steps
    value: ${{ steps.builder.outputs.path }}
runs:
  using: composite
  steps:
  - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
    with:
      go-version-file: ${{ github.action_path }}/go.mod
      cache: false
  - name: Compile Go assembler
    id: builder
    shell: bash
    working-directory: ${{ github.action_path }}
    run: |
      make tools
      echo "path=$PWD/dist/wippy-builder" >> "$GITHUB_OUTPUT"
  - name: Build application
    shell: bash
    env:
      BUILDER_BINARY: ${{ steps.builder.outputs.path }}
      MANIFEST_PATH: ${{ inputs.manifest }}
      BINARY_PATH: ${{ inputs.output }}
      BUILD_MODE: ${{ inputs.mode }}
      GH_TOKEN: ${{ inputs.token }}
    run: |
      case "$BUILD_MODE" in build|toolchain) ;; *) echo 'Invalid build mode' >&2; exit 1 ;; esac
      if [ -n "$GH_TOKEN" ]; then gh auth setup-git --hostname github.com; fi
      "$BUILDER_BINARY" "$BUILD_MODE" "$MANIFEST_PATH" --output "$BINARY_PATH"
