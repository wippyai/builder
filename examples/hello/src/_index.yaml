version: '1.0'
namespace: example.hello
entries:
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules:
  - io
  meta:
    command:
      name: hello
      main: true
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true
- name: arguments
  kind: process.lua
  source: file://arguments.lua
  method: main
  modules:
  - io
  meta:
    command:
      name: arguments
